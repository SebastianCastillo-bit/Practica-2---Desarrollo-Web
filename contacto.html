<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
</head>

<body>

    <h1>Contacto</h1>

    <p>
        Si quieres compartir tu opinión sobre el fútbol,
        puedes utilizar el siguiente formulario.
    </p>

    <hr>

    <h2>Menú</h2>

    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="equipos.html">Equipos</a></li>
        <li><a href="jugadores.html">Jugadores</a></li>
        <li><a href="videojuegos.html">Videojuegos</a></li>
        <li><a href="contacto.html">Contacto</a></li>
    </ul>

    <hr>

    <h2>Formulario de contacto</h2>

    <form>

        <label for="nombre">Nombre:</label>
        <br>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

        <br>
        <br>

        <label for="correo">Correo electrónico:</label>
        <br>
        <input type="email" id="correo" name="correo" placeholder="Escribe tu correo">

        <br>
        <br>

        <label for="mensaje">Mensaje:</label>
        <br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="30"
            placeholder="Escribe tu mensaje"></textarea>

        <br>
        <br>

        <button type="submit">Enviar</button>

    </form>

    <hr>

    <p>
        Gracias por visitar mi sitio sobre fútbol.
    </p>

</body>

</html>
